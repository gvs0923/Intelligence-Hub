x-backend: &backend
  build: .
  environment:
    - OLLAMA_BASE_URL=http://ollama:11434
    - REDIS_URL=redis://redis:6379/0
    - CHROMA_HOST=chroma
    - CHROMA_PORT=8000
    - SQLITE_DB_PATH=/app/data/metadata.db
  volumes:
    - ./data:/app/data
  depends_on:
    ollama:
      condition: service_healthy
    redis:
      condition: service_healthy
    chroma:
      condition: service_healthy

services:
  app:
    <<: *backend
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["uv", "run", "celery", "-A", "src.tasks.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1"]

  ui:
    build: .
    command: ["uv", "run", "streamlit", "run", "src/ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://app:8000
    depends_on:
      - app

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  chroma_data: